<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>שחמט — תצוגה מקדימה</title>
<style>
  :root{ --gold:#E8C879; --gold-deep:#C9A24A; --cream:#F3E2BE;
    --wood-frame: repeating-linear-gradient(91deg, rgba(0,0,0,.06) 0 1px, transparent 1px 5px), linear-gradient(155deg,#7d5430 0%,#553720 55%,#3a2410 100%); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Assistant','Segoe UI',sans-serif; background:radial-gradient(120% 90% at 50% 0%, #3a2716, #160d05 75%); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:16px 8px 40px; }
  .phone{ width:100%; max-width:430px; }
  .header{ background:var(--wood-frame); border-bottom:2px solid var(--gold-deep); padding:13px 16px; display:flex; align-items:center; justify-content:center; position:relative; border-radius:16px 16px 0 0; box-shadow:0 4px 12px rgba(0,0,0,.4); }
  .header .title{ font-family:'Suez One',serif; font-weight:800; font-size:22px; color:var(--gold); text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .header .back{position:absolute; inset-inline-start:16px; color:var(--gold); font-size:22px;}
  .header .menu{position:absolute; inset-inline-end:16px; color:var(--gold); font-size:20px;}

  .stage{ background:var(--wood-frame); padding:14px; border-radius:0 0 18px 18px; border:1px solid #2a1a0c; border-top:none; box-shadow:0 18px 40px -10px rgba(0,0,0,.8); }
  /* מסגרת פליז סביב הלוח */
  .frame{ background:linear-gradient(160deg,#caa24a,#6e4a1e); border-radius:10px; padding:7px;
    box-shadow:inset 0 2px 3px rgba(255,235,180,.5), inset 0 -3px 6px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.4); }
  .board-svg{ display:block; width:100%; height:auto; border-radius:4px; box-shadow:0 6px 16px rgba(0,0,0,.4); }
  .caption{ color:#caa98c; text-align:center; font-size:12.5px; margin-top:16px; line-height:1.6; }
  .caption b{ color:var(--gold); }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <span class="back">→</span>
      <span class="title">שחמט</span>
      <span class="menu">☰</span>
    </div>
    <div class="stage">
      <div class="frame">
        <svg class="board-svg" id="board" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div class="caption">
      תצוגה מקדימה — <b>לוח שטוח, משבצות מושלמות</b>, עץ רוזווד/מייפל וכלים וקטוריים מוצללים עם נפח.<br>
      זה הסגנון שאפשר לבנות באפליקציה ונוח לתפעול במובייל. אם תרצה כלים מפוארים יותר — אשלב סט וקטורי מקצועי בעת הבנייה.
    </div>
  </div>

<script>
const NS='http://www.w3.org/2000/svg';
const board=document.getElementById('board');

// ── defs: גרדיאנטים, צללים ── 
board.innerHTML = `
<defs>
  <linearGradient id="sqL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efdcae"/><stop offset="1" stop-color="#d6bc83"/>
  </linearGradient>
  <linearGradient id="sqD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7c4528"/><stop offset="1" stop-color="#532712"/>
  </linearGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#fffaf0"/><stop offset="0.45" stop-color="#ecdfc4"/>
    <stop offset="0.78" stop-color="#d7c094"/><stop offset="1" stop-color="#bb9f6e"/>
  </linearGradient>
  <linearGradient id="ebony" x1="0" y1="0" x2="0.25" y2="1">
    <stop offset="0" stop-color="#74583a"/><stop offset="0.45" stop-color="#3e2a17"/>
    <stop offset="1" stop-color="#190f07"/>
  </linearGradient>
  <radialGradient id="sheen" cx="0.38" cy="0.3" r="0.7">
    <stop offset="0" stop-color="rgba(255,255,255,0.30)"/><stop offset="0.5" stop-color="rgba(255,255,255,0)"/>
  </radialGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.55)"/>
  </filter>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="rgba(255,245,220,0.16)"/><stop offset="0.4" stop-color="rgba(255,245,220,0)"/>
  </linearGradient>
</defs>`;

// ── משבצות ──
const FILES=['a','b','c','d','e','f','g','h'];
for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const rect=document.createElementNS(NS,'rect');
  rect.setAttribute('x',c*100); rect.setAttribute('y',r*100);
  rect.setAttribute('width',100); rect.setAttribute('height',100);
  rect.setAttribute('fill',(r+c)%2===0?'url(#sqL)':'url(#sqD)');
  board.appendChild(rect);
}
// ברק עליון על כל הלוח
const gloss=document.createElementNS(NS,'rect');
gloss.setAttribute('x',0);gloss.setAttribute('y',0);gloss.setAttribute('width',800);gloss.setAttribute('height',800);
gloss.setAttribute('fill','url(#gloss)'); board.appendChild(gloss);

// תוויות קואורדינטות
for(let i=0;i<8;i++){
  const f=document.createElementNS(NS,'text');
  f.setAttribute('x',i*100+92); f.setAttribute('y',792); f.setAttribute('text-anchor','end');
  f.setAttribute('font-size','15'); f.setAttribute('font-weight','800');
  f.setAttribute('fill',(7+i)%2===0?'#532712':'#efdcae'); f.setAttribute('opacity','0.6');
  f.textContent=FILES[i]; board.appendChild(f);
  const rk=document.createElementNS(NS,'text');
  rk.setAttribute('x',6); rk.setAttribute('y',i*100+18);
  rk.setAttribute('font-size','15'); rk.setAttribute('font-weight','800');
  rk.setAttribute('fill',(i)%2===0?'#532712':'#efdcae'); rk.setAttribute('opacity','0.6');
  rk.textContent=8-i; board.appendChild(rk);
}

// ── צורות כלים (תא 100x100) ──
function piece(type){
  // base משותף + collar
  const base = `<path d="M27 92 C27 84 34 83 36 79 L64 79 C66 83 73 84 73 92 Z"/>`;
  let s='';
  if(type==='p'){ // חייל
    s = `<ellipse cx="50" cy="40" rx="11" ry="11"/>
         <path d="M41 50 C37 50 36 54 39 56 L61 56 C64 54 63 50 59 50 Z"/>
         <path d="M40 56 C35 64 33 72 33 79 H67 C67 72 65 64 60 56 Z"/>${base}`;
  } else if(type==='r'){ // צריח
    s = `<rect x="32" y="16" width="8" height="13" rx="1.5"/>
         <rect x="46" y="16" width="8" height="13" rx="1.5"/>
         <rect x="60" y="16" width="8" height="13" rx="1.5"/>
         <rect x="30" y="27" width="40" height="8" rx="2"/>
         <path d="M35 35 L33 56 H67 L65 35 Z"/>
         <path d="M33 56 C33 64 33 73 32 79 H68 C67 73 67 64 67 56 Z"/>${base}`;
  } else if(type==='b'){ // רץ
    s = `<circle cx="50" cy="15" r="5"/>
         <path d="M50 19 C40 22 38 34 42 43 C45 49 55 49 58 43 C62 34 60 22 50 19 Z"/>
         <path d="M44 30 L54 23" stroke-linecap="round" class="slit"/>
         <ellipse cx="50" cy="47" rx="13" ry="4.5"/>
         <path d="M40 50 C36 60 34 72 34 79 H66 C66 72 64 60 60 50 Z"/>${base}`;
  } else if(type==='n'){ // פרש (ראש סוס פונה שמאלה)
    s = `<path d="M33 79 C33 66 36 58 47 53
                  C42 53 37 53 35 49 C44 48 41 41 45 38
                  C40 38 36 36 36 31 C36 25 41 19 49 16
                  L52 9 L57 13 L56 19
                  C64 20 70 28 71 40 C72 54 71 68 68 79 Z"/>
         <circle cx="44" cy="33" r="2.2" class="eye"/>${base}`;
  } else if(type==='q'){ // מלכה
    s = `<circle cx="32" cy="22" r="4.5"/><circle cx="41" cy="17" r="4.5"/>
         <circle cx="50" cy="15" r="5"/><circle cx="59" cy="17" r="4.5"/><circle cx="68" cy="22" r="4.5"/>
         <path d="M32 24 L37 47 H63 L68 24 L59 32 L50 20 L41 32 Z"/>
         <ellipse cx="50" cy="49" rx="15" ry="4.5"/>
         <path d="M38 52 C34 62 33 72 33 79 H67 C67 72 66 62 62 52 Z"/>${base}`;
  } else { // מלך
    s = `<rect x="46" y="6" width="8" height="18" rx="2"/>
         <rect x="41" y="11" width="18" height="7" rx="2"/>
         <path d="M50 24 C42 24 36 30 36 37 C36 42 42 46 50 46 C58 46 64 42 64 37 C64 30 58 24 50 24 Z"/>
         <ellipse cx="50" cy="48" rx="15" ry="4.5"/>
         <path d="M38 51 C34 61 33 72 33 79 H67 C67 72 66 61 62 51 Z"/>${base}`;
  }
  return s;
}

const START=[
  ['r','n','b','q','k','b','n','r'],
  ['p','p','p','p','p','p','p','p'],
  ['','','','','','','',''],['','','','','','','',''],
  ['','','','','','','',''],['','','','','','','',''],
  ['P','P','P','P','P','P','P','P'],
  ['R','N','B','Q','K','B','N','R'],
];

for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const p=START[r][c]; if(!p) continue;
  const white = p===p.toUpperCase();
  const fill = white?'url(#ivory)':'url(#ebony)';
  const stroke = white?'#6b4a2a':'#0b0805';
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${c*100},${r*100})`);

  // צל מגע
  const sh=document.createElementNS(NS,'ellipse');
  sh.setAttribute('cx',50); sh.setAttribute('cy',90); sh.setAttribute('rx',24); sh.setAttribute('ry',6);
  sh.setAttribute('fill','rgba(0,0,0,0.32)'); sh.setAttribute('filter','blur(1px)');
  g.appendChild(sh);

  // גוף הכלי
  const body=document.createElementNS(NS,'g');
  body.setAttribute('filter','url(#soft)');
  body.innerHTML = piece(p.toLowerCase());
  // צבע לכל הצורות
  [...body.querySelectorAll('path,circle,ellipse,rect')].forEach(el=>{
    if(el.classList.contains('slit')||el.classList.contains('eye')){
      el.setAttribute('stroke', white?'#6b4a2a':'#0b0805'); el.setAttribute('stroke-width','2.4');
      el.setAttribute('fill', el.tagName==='circle'?(white?'#6b4a2a':'#0b0805'):'none');
    } else {
      el.setAttribute('fill',fill); el.setAttribute('stroke',stroke);
      el.setAttribute('stroke-width','2.2'); el.setAttribute('stroke-linejoin','round');
    }
  });
  g.appendChild(body);

  // ברק עדין מלמעלה
  const sheen=document.createElementNS(NS,'ellipse');
  sheen.setAttribute('cx',44); sheen.setAttribute('cy',38); sheen.setAttribute('rx',13); sheen.setAttribute('ry',22);
  sheen.setAttribute('fill','url(#sheen)'); sheen.setAttribute('pointer-events','none');
  g.appendChild(sheen);

  board.appendChild(g);
}
</script>
</body>
</html>
