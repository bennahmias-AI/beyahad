<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A4D6A"/>
      <stop offset="1" stop-color="#6B3A4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#E8C879" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#E8C879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- ── content kept inside a centered safe zone (~78%) so maskable
       cropping on Android never clips the figures or heart ── -->

  <!-- small heart above, centered -->
  <path d="M 256 120
    C 238 96 202 99 202 132
    C 202 159 256 188 256 188
    C 256 188 310 159 310 132
    C 310 99 274 96 256 120 Z" fill="#E8896A"/>

  <!-- two figures — "togetherness" -->
  <g transform="translate(256,288)">
    <!-- left figure (mustard) -->
    <circle cx="-56" cy="-42" r="44" fill="#E8C879"/>
    <path d="M -56 12
             C -112 12 -124 74 -120 116
             L 8 116
             C 4 64 -8 12 -56 12 Z" fill="#E8C879"/>
    <!-- right figure (cream) -->
    <circle cx="56" cy="-42" r="44" fill="#FBF7EE"/>
    <path d="M 56 12
             C 112 12 124 74 120 116
             L -8 116
             C -4 64 8 12 56 12 Z" fill="#FBF7EE"/>
  </g>
</svg>
