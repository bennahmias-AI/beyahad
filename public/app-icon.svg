<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A4D6A"/>
      <stop offset="1" stop-color="#6B3A4F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#E8C879" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8C879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- two overlapping hearts / people — "togetherness" -->
  <g transform="translate(256,250)">
    <!-- left figure -->
    <circle cx="-58" cy="-46" r="46" fill="#E8C879"/>
    <path d="M -58 12 C -120 12 -132 78 -128 124 L 12 124 C 4 70 -8 12 -58 12 Z" fill="#E8C879"/>
    <!-- right figure -->
    <circle cx="58" cy="-46" r="46" fill="#FBF7EE"/>
    <path d="M 58 12 C 120 12 132 78 128 124 L -12 124 C -4 70 8 12 58 12 Z" fill="#FBF7EE"/>
  </g>

  <!-- small heart above -->
  <path d="M 256 92
    C 240 70 208 72 208 102
    C 208 126 256 152 256 152
    C 256 152 304 126 304 102
    C 304 72 272 70 256 92 Z" fill="#E8896A"/>
</svg>
